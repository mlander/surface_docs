# Every talking point on the site, its maturity and where it is headed.
#
# The status strip on each page and the board are built from this file.
# `maturity` is set by a person and only by a person (see
# docs/about/maturity.md). `proposed` is a first reading from the
# repository's evidence, for that person to accept or correct.
# A change of level goes in its own commit, with the reason.

levels:
  settled:
    label: Settled
    meaning: Designed with recorded decisions, reviewed by a person other than its author, tested end to end.
  working:
    label: Working
    meaning: Built and tested end to end. The design has not been reviewed by another person.
  sketch:
    label: Sketch
    meaning: In the code, mostly generated, not reviewed. Proves that something is possible.
  question:
    label: Question
    meaning: Not built. A stated question.

destinations:
  core-1:
    label: Core, step 1
  core-2:
    label: Core, step 2
  core-3:
    label: Core, step 3
  core-4:
    label: Core, step 4
  core-5:
    label: Core, step 5
  poc:
    label: Stays in the proof of concept
  later:
    label: Later
  open:
    label: Not decided

packages:
  groundwork:
    label: Groundwork in core
    summary: Small additive changes to Typed Data, validation and the Field API that the three concepts read from. Not a concept of its own.
  structures:
    label: Structures
    summary: The description of a thing's data. Read from config schema and field definitions, or declared in code where those cannot say enough.
  resources:
    label: Resources and operations
    summary: The thing itself, where it is stored, who may change it, and the named actions on it. A form, a Tool API tool and HTTP are each one way to run an operation.
  portable-schema:
    label: Portable Schema
    summary: How a structure is written down and served. JSON Schema, with a small agreed set of extension keywords.
  poc:
    label: Stays in the proof of concept
    summary: Working parts that are not part of the core path.
  questions:
    label: Open questions
    summary: Not decided yet.

